<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas - Anthonny Cristhyan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1 class="titulo-principal">Gerenciador de Tarefas Acadêmicas</h1>
    </header>

    <main>
        <section aria-labelledby="filtros-titulo">
            <h2 id="filtros-titulo">Busca e Filtros</h2>
            <form>
                <p>
                    <label for="busca-titulo">Buscar por título da tarefa:</label>
                    <input type="text" id="busca-titulo" name="busca">
                </p>

                <p>
                    <label for="filtro-status">Filtrar por Status:</label>
                    <select id="filtro-status" name="status">
                        <option value="todos">Todos os status</option>
                        <option value="a-fazer">A fazer</option>
                        <option value="em-andamento">Em andamento</option>
                        <option value="em-revisao">Em revisão</option>
                        <option value="concluida">Concluída</option>
                    </select>
                </p>

                <fieldset>
                    <legend>Filtrar por Prioridade</legend>

                    <input type="radio" id="prioridade-todas" name="prioridade" value="todas" checked>
                    <label for="prioridade-todas">Todas</label>

                    <input type="radio" id="prioridade-baixa" name="prioridade" value="baixa">
                    <label for="prioridade-baixa">Baixa</label>

                    <input type="radio" id="prioridade-media" name="prioridade" value="media">
                    <label for="prioridade-media">Média</label>

                    <input type="radio" id="prioridade-alta" name="prioridade" value="alta">
                    <label for="prioridade-alta">Alta</label>
                </fieldset>

                <p>
                    <label for="ordenacao">Ordenar por:</label>
                    <select id="ordenacao" name="ordenacao">
                        <option value="prazo-asc">Prazo (mais próximo primeiro)</option>
                        <option value="prazo-desc">Prazo (mais distante primeiro)</option>
                        <option value="prioridade-desc">Prioridade (alta primeiro)</option>
                        <option value="titulo-asc">Título (A-Z)</option>
                    </select>
                </p>

                <p>
                    <button type="button" class="botao-acao" data-acao-limpar>Limpar filtros</button>
                </p>
            </form>
        </section>

        <p data-estado role="status" aria-live="polite" class="texto-padrao"></p>

        <section aria-labelledby="quadro-titulo" class="quadro-projetos" data-quadro>
            <h2 id="quadro-titulo">Quadro de Projetos</h2>

            <section aria-labelledby="status-afazer" class="coluna-status">
                <h3 id="status-afazer">A fazer</h3>
                <ul class="lista-tarefas" data-lista-status="a-fazer"></ul>
            </section>

            <section aria-labelledby="status-andamento" class="coluna-status">
                <h3 id="status-andamento">Em andamento</h3>
                <ul class="lista-tarefas" data-lista-status="em-andamento"></ul>
            </section>

            <section aria-labelledby="status-revisao" class="coluna-status">
                <h3 id="status-revisao">Em revisão</h3>
                <ul class="lista-tarefas" data-lista-status="em-revisao"></ul>
            </section>

            <section aria-labelledby="status-concluida" class="coluna-status">
                <h3 id="status-concluida">Concluída</h3>
                <ul class="lista-tarefas" data-lista-status="concluida"></ul>
            </section>
        </section>
    </main>

    <footer>
        <p>Desenvolvido por <strong>Anthonny Cristhyan</strong> - Desenvolvimento Front-end</p>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
